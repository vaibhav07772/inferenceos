version: "3.9"

services:
  inferenceos-api:
    build: .
    container_name: inferenceos-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  inferenceos-ui:
    build: .
    container_name: inferenceos-ui
    command: ["streamlit", "run", "src/dashboard/app.py",
              "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - inferenceos-api
    restart: unless-stopped